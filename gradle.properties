org.gradle.jvmargs=-Xmx3g
# No daemon: an idle one outside the agent sandbox keeps the ~/.gradle cache lock and cannot hear
# a sandboxed build's release request, which then times out. Sandboxed builds never reuse daemons anyway.
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
# connected tests must not uninstall the app: that would drop the keyboard setup and saved takes
android.injected.androidTest.leaveApksInstalledAfterRun=true
