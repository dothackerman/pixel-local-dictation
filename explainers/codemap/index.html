<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codemap Explorer</title>
<meta name="description" content="Deterministic explorer for tools/codemap.py output: components, files, call graphs, sequences and source.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Operate surface: top bar + breadcrumb, diagram canvas left, detail panel right (stacked on phones).
   Signature move: components sit on horizontal layer strata; a dependency that climbs a stratum is a red dashed violation.
   accent/teal = selection + ok, amber = watch, grey = unknown (never red), red = policy violation, violet = observed (trace). */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --panel:#eef1f5; --fg:#1b2130; --muted:#5b6477; --line:#d8dce5; --code-bg:#eef1f6;
  --accent:#0f8b8d; --accent-soft:#d7f0f0; --warn:#9a5a06; --warn-fill:#d58a1c; --warn-soft:#fbead2;
  --bad:#c23a3a; --bad-soft:#f8dede; --obs:#7b3fb8; --obs-soft:#eee2f8;
  --unk:#b9bfca; --edge:#8d95a5; --band:#e9ecf1; --band-alt:#f1f3f6; --on-fill:#ffffff;
  --body:"Schibsted Grotesk", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1f29; --panel:#161a22; --fg:#e6e9f0; --muted:#9aa3b5; --line:#2e3542; --code-bg:#151a23;
  --accent:#3cc2c4; --accent-soft:#16393b; --warn:#f0a440; --warn-fill:#c98327; --warn-soft:#3d2c12;
  --bad:#ff7a7a; --bad-soft:#4a2020; --obs:#c393ef; --obs-soft:#33264a;
  --unk:#4a5262; --edge:#6c7588; --band:#181c25; --band-alt:#1d222c; --on-fill:#10131a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1f29; --panel:#161a22; --fg:#e6e9f0; --muted:#9aa3b5; --line:#2e3542; --code-bg:#151a23;
  --accent:#3cc2c4; --accent-soft:#16393b; --warn:#f0a440; --warn-fill:#c98327; --warn-soft:#3d2c12;
  --bad:#ff7a7a; --bad-soft:#4a2020; --obs:#c393ef; --obs-soft:#33264a;
  --unk:#4a5262; --edge:#6c7588; --band:#181c25; --band-alt:#1d222c; --on-fill:#10131a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100dvh;
  caret-color:var(--accent);accent-color:var(--accent);scrollbar-color:var(--line) transparent}
::selection{background:var(--accent-soft);color:var(--fg)}
a{color:var(--accent);text-underline-offset:3px}
code,.mono{font-family:var(--mono);font-size:.86em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 0}
.brand h1{font-size:1.05rem;font-weight:800;margin:0;letter-spacing:-.01em}
.brand .meta{font-family:var(--mono);font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:0 1 520px;min-width:240px}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 34px 0 12px}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.search kbd{position:absolute;right:8px;top:8px;font-family:var(--mono);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:18px}
.results{position:absolute;z-index:20;left:0;right:0;top:40px;margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgb(0 0 0 / .14);max-height:min(60vh,420px);overflow:auto}
.results li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:6px 8px;border-radius:6px;cursor:pointer}
.results li[aria-selected="true"]{background:var(--accent-soft)}
.results .k{grid-row:span 2;font-family:var(--mono);font-size:.68rem;color:var(--muted);align-self:center;min-width:5.5em}
.results .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .pt{font-family:var(--mono);font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .none{display:block;color:var(--muted);cursor:default}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{background:var(--accent-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Breadcrumb */
.crumbs{padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);font-size:.85rem;overflow-x:auto;white-space:nowrap}
.crumbs ol{display:flex;gap:6px;margin:0;padding:0;list-style:none;align-items:center}
.crumbs li{display:flex;align-items:center;gap:6px}
.crumbs li+li::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-top:1.5px solid var(--muted);transform:rotate(45deg);margin-right:4px}
.crumbs .kind{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-right:2px}
.crumbs [aria-current]{font-weight:700}

/* Work area */
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.canvas{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.tools h2{font-size:.95rem;margin:0 auto 0 0;font-weight:700;min-width:0}
.tools h2 .sub{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:0 12px;height:30px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.seg button:hover{background:var(--panel)}
label.sel{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
label.sel select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 6px;color:var(--fg);max-width:240px}
.zoom{display:inline-flex;gap:4px}
.zoom .btn{width:32px;padding:0;justify-content:center}
.stage{position:relative;flex:1;min-height:0;background:var(--bg)}
.stage svg.dia{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
.stage svg.dia.panning{cursor:grabbing}
.stage .note{position:absolute;left:12px;bottom:10px;font-size:.78rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;pointer-events:none}
.stage .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}

/* Diagram */
svg text{font-family:var(--body);fill:var(--fg)}
.dia .t-name{font-weight:700;font-size:14px}
.dia .t-sm{font-size:11.5px;fill:var(--muted)}
.dia .t-mono{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.dia .t-band{font-family:var(--mono);font-size:11px;fill:var(--muted);font-weight:600}
.dia .band{fill:var(--band)} .dia .band.alt{fill:var(--band-alt)}
.dia .band.apart{fill:none;stroke:var(--line);stroke-dasharray:6 5}
.dia .card{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.dia .n{transition:opacity .15s}
.dia a.n,.dia g.n[tabindex]{cursor:pointer;outline:none}
.dia a.n:hover .card,.dia g.n[tabindex]:hover .card{stroke:var(--accent)}
.dia .n:focus-visible .card{stroke:var(--accent);stroke-width:3}
.dia .n.focus .card{stroke:var(--accent);stroke-width:2.5;fill:var(--accent-soft)}
.dia .n.ext{opacity:.62}
.dia .n.ext .card{stroke-dasharray:4 3}
.dia .n.badge .card{fill:var(--panel);stroke-dasharray:3 3}
.dia .n.viol .card{stroke:var(--bad)}
.dia .e{fill:none;stroke:var(--edge);transition:opacity .15s}
.dia .e.viol{stroke:var(--bad);stroke-dasharray:7 5}
.dia .e.obs{stroke:var(--obs);stroke-dasharray:2 4}
.dia .e.ext{opacity:.4}
.dia .elab{font-size:10.5px;font-family:var(--mono);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.dia .elab.viol{fill:var(--bad);font-weight:600}
.dia .elab.obs{fill:var(--obs)}
.dia .elab.cnt{fill:var(--muted)}
.dia.dim .n:not(.lit){opacity:.3}
.dia.dim .e:not(.lit),.dia.dim .elab:not(.lit){opacity:.1}
.dia .hb-ok{fill:var(--accent)} .dia .hb-watch{fill:var(--warn-fill)} .dia .hb-unknown{fill:var(--unk)}
.dia .t-bad{fill:var(--bad);font-weight:600;font-size:11.5px}
.dia .pill{fill:var(--panel);stroke:var(--line)}
.dia .life{stroke:var(--line);stroke-dasharray:4 4}
.dia .act{fill:var(--accent-soft);stroke:var(--accent)}
.dia .msgl{stroke:var(--fg);fill:none;stroke-width:1.3}
.dia .msgl.obs{stroke:var(--obs)}
.dia .row-hl{fill:var(--accent-soft)}
.dia .t-num{font-family:var(--mono);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.dia .t-note{font-size:11px;fill:var(--muted);font-style:italic}
.dia .ah{fill:var(--edge)} .dia .ah-viol{fill:var(--bad)} .dia .ah-obs{fill:var(--obs)} .dia .ah-fg{fill:var(--fg)}

/* Panel */
.panel{overflow:auto;background:var(--panel);padding:16px 16px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.panel section{display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h2{font-size:1.05rem;margin:0;line-height:1.25;overflow-wrap:anywhere}
.panel h3{font-size:.82rem;margin:0;font-weight:700;color:var(--muted)}
.panel p{margin:0;max-width:66ch}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.unknown{color:var(--muted);font-style:italic}
pre.sig{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;overflow-wrap:anywhere}
.src{font-family:var(--mono);font-size:.8rem;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.78rem}
td a{overflow-wrap:break-word}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tbl tr:last-child td{border-bottom:0}
.hb{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;white-space:nowrap}
.hb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--unk)}
.hb.ok::before{background:var(--accent)} .hb.watch::before{background:var(--warn-fill)}
.hb.watch{color:var(--warn)} .hb.unknown{color:var(--muted)}
.hbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--unk)}
.hbar i{display:block} .hbar .ok{background:var(--accent)} .hbar .watch{background:var(--warn-fill)} .hbar .unknown{background:var(--unk)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.84rem}
.legend li{display:flex;align-items:center;gap:10px}
.legend svg{flex:none;width:44px;height:14px}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.vlist li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.84rem;display:flex;flex-direction:column;gap:2px}
.vlist .rule{font-family:var(--mono);font-size:.74rem;color:var(--bad);font-weight:600}
.vlist .rdesc{color:var(--muted);font-size:.8rem}
.vlist .ft{font-family:var(--mono);font-size:.76rem;overflow-wrap:anywhere}
.vlist .ft span{color:var(--muted)}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.86rem}
.links li{display:flex;gap:8px;align-items:baseline;min-width:0}
.links .ln{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap}
.links code{overflow-wrap:anywhere;min-width:0}
.links a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag{font-family:var(--mono);font-size:.7rem;padding:1px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.obs{color:var(--obs);border-color:var(--obs)}
.tag.static{color:var(--fg)}
.status{font-size:.86rem;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.status.obs{border-color:var(--obs);background:var(--obs-soft)}
ol.seqtext{margin:0;padding-left:2.2em;font-size:.82rem;display:flex;flex-direction:column;gap:2px}
ol.seqtext .hl{font-weight:700}
.muted{color:var(--muted)}

/* Empty state */
.empty{grid-column:1/-1;display:grid;place-items:start center;overflow:auto;padding:48px 16px}
.empty .box{max-width:680px;width:100%;display:flex;flex-direction:column;gap:16px}
.empty h2{font-size:1.5rem;margin:0;letter-spacing:-.01em}
.empty p{margin:0;max-width:66ch}
.empty pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:.84rem;overflow-x:auto}
.empty .drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface)}
.empty .err{color:var(--bad);font-size:.9rem}
body.dragging .empty .drop,body.dragging .work{outline:2px dashed var(--accent);outline-offset:-6px}

@media (max-width:900px){
  body{display:block;height:auto}
  .work{display:flex;flex-direction:column}
  .canvas{border-right:0;border-bottom:1px solid var(--line)}
  .stage{flex:none;height:62svh}
  .panel{overflow:visible}
  .search{order:3;flex-basis:100%;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><h1>Codemap</h1><span class="meta" id="meta">no graph loaded</span></div>
  <div class="search" role="search">
    <label for="q" class="vh">Search nodes by name, qualified name or path</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search name, qualname or path" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" disabled>
    <kbd aria-hidden="true">/</kbd>
    <ul id="results" class="results" role="listbox" aria-label="Search results" hidden></ul>
  </div>
  <label class="btn" for="file" title="Open a graph.json from disk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M12 4v12M7 11l5 5 5-5"/></svg>Open file</label>
  <input id="file" class="vh" type="file" accept=".json,application/json">
</header>
<nav class="crumbs" aria-label="Breadcrumb"><ol id="crumbs"><li><span aria-current="page">Codemap</span></li></ol></nav>
<div class="work" id="work"></div>
<div class="vh" aria-live="polite" id="live"></div>

<script>
"use strict";
/* ---------- utilities ---------- */
const NS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clip = (s, n) => (s = String(s ?? ""), s.length > n ? s.slice(0, Math.max(1, n - 1)) + "…" : s);
const fmt = n => (n == null ? "unknown" : Number(n).toLocaleString("en-US"));
const plural = (n, w, p) => `${fmt(n)} ${n === 1 ? w : (p || w + "s")}`;
function svg(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function text(parent, x, y, s, cls, extra) {
  const t = svg("text", Object.assign({x, y, class: cls}, extra || {}), parent);
  t.textContent = s; return t;
}
const DEP = new Set(["imports", "calls", "extends"]);
const KIND_ORDER = {component: 0, file: 1, type: 2, function: 3, system: 4};
const HEALTH = ["ok", "watch", "unknown"];
const CAP_GRAPH = 80, CAP_EXT = 14, CAP_FN = 40, CAP_SEQ = 200;

/* ---------- index (built once per graph) ---------- */
let G = null, I = null, SOURCE = "";
function buildIndex(g) {
  const ix = {byId: new Map(), kids: new Map(), out: new Map(), inn: new Map(), memo: {}, stat: new Map(),
              viol: Array.isArray(g.violations) ? g.violations : [], traces: Array.isArray(g.traces) ? g.traces : []};
  const nodes = Array.isArray(g.nodes) ? g.nodes : [];
  for (const n of nodes) if (n && typeof n.id === "string") ix.byId.set(n.id, n);
  for (const n of ix.byId.values()) {
    if (n.parent == null) continue;
    if (!ix.kids.has(n.parent)) ix.kids.set(n.parent, []);
    ix.kids.get(n.parent).push(n.id);
  }
  for (const a of ix.kids.values()) a.sort((x, y) => (ix.byId.get(x).line ?? 0) - (ix.byId.get(y).line ?? 0) || cmp(x, y));
  ix.edges = [];
  for (const e of Array.isArray(g.edges) ? g.edges : []) {
    if (!e || !ix.byId.has(e.from) || !ix.byId.has(e.to)) continue;
    ix.edges.push(e);
    if (!ix.out.has(e.from)) ix.out.set(e.from, []);
    if (!ix.inn.has(e.to)) ix.inn.set(e.to, []);
    ix.out.get(e.from).push(e); ix.inn.get(e.to).push(e);
  }
  I = ix;
  ix.components = [...ix.byId.values()].filter(n => n.kind === "component")
    .sort((a, b) => (b.layer ?? -1e9) - (a.layer ?? -1e9) || cmp(a.name, b.name) || cmp(a.id, b.id));
  for (const c of ix.components) ix.stat.set(c.id, {files: 0, types: 0, fns: 0, ok: 0, watch: 0, unknown: 0, loc: 0, viol: []});
  for (const n of ix.byId.values()) {
    const c = compOf(n.id); if (!c || c === n.id) continue;
    const s = ix.stat.get(c); if (!s) continue;
    if (n.kind === "file") { s.files++; s.loc += n.metrics?.loc ?? 0; }
    else if (n.kind === "type") s.types++;
    else if (n.kind === "function") { s.fns++; s[health(n)]++; }
  }
  // aggregated component edges
  ix.cEdges = aggregate(ix.edges, compOf);
  ix.violBy = new Map();
  const addV = (k, v) => { if (!k) return; if (!ix.violBy.has(k)) ix.violBy.set(k, []); ix.violBy.get(k).push(v); };
  for (const v of ix.viol) {
    addV(v.from, v); if (ix.byId.has(v.to)) addV(v.to, v);
    const cf = compOf(v.from), ct = ix.byId.has(v.to) ? compOf(v.to) : null;
    if (cf && ix.stat.has(cf)) ix.stat.get(cf).viol.push(v);
    if (cf && ct && cf !== ct) markViol(ix.cEdges, cf, ct, v);
  }
  ix.search = [];
  for (const n of ix.byId.values()) {
    if (n.kind === "system") continue;
    ix.search.push({id: n.id, n, name: String(n.name ?? "").toLowerCase(), q: String(n.qualname ?? "").toLowerCase(), p: String(n.path ?? "").toLowerCase()});
  }
  ix.cache = new Map();
  return ix;
}

  const cover = observed ? `Showing <b>observed (trace ${esc(trace.name || trace.id)})</b>: events recorded in <code>${esc(trace.source || "?")}</code>. Rows that involve this function are highlighted.`
                         : `Showing <b>static (possible calls)</b>: callees followed depth-first in call-line order, depth ≤ ${sdepth}, cycles shown once. Branches and loops are not modelled.${I.traces.length ? " Pick a trace under Source to see observed behaviour." : " No traces loaded; pass <code>--trace FILE</code> to the extractor."}`;
  return `<section><h3>Sequence: ${esc(title)}</h3><p class="status${observed ? " obs" : ""}">${cover}${truncated ? ` Truncated at ${CAP_SEQ} rows.` : ""}</p>${rows.length ? `<ol class="seqtext">${text_.join("")}</ol>` : ""}</section>`;
}

/* ---------- breadcrumb, header, search ---------- */
function crumbs(id) {
  if (!I) { $("#crumbs").innerHTML = `<li><span aria-current="page">Codemap</span></li>`; return; }
  const chain = []; let cur = id;
  while (cur != null && I.byId.has(cur)) { const n = I.byId.get(cur); if (n.kind !== "system") chain.unshift(n); cur = n.parent; }
  const sysName = G.generated_from?.root_name || I.byId.get("sys")?.name || "System";
  const items = [`<li>${id ? `<a href="#/">${esc(sysName)}</a>` : `<span aria-current="page">${esc(sysName)}</span>`}</li>`];
  chain.forEach((n, i) => {
    const last = i === chain.length - 1, inner = `<span class="kind">${esc(n.kind)}</span>${esc(clip(label(n), 48))}`;
    items.push(`<li>${last ? `<span aria-current="page">${inner}</span>` : `<a href="${nodeHref(n.id)}">${inner}</a>`}</li>`);
  });
  $("#crumbs").innerHTML = items.join("");
}
function render() {
  if (!I) return;
  const r = parseHash();
  let id = r.id, view = r.view;
  const n = id != null ? I.byId.get(id) : null;
  if (view === "components" || view === "" || view === "system") { id = null; viewComponents(); }
  else if (!n) { crumbs(null); work.innerHTML = `<div class="empty"><div class="box"><h2>Node not found</h2><p>No node with id <code>${esc(r.id)}</code> in this graph. It may have been renamed or removed since the link was made.</p><p><a href="#/">Back to components</a></p></div></div>`; return; }
  else if (n.kind === "component") viewComponent(id, r.qs);
  else if (n.kind === "file" || n.kind === "type") viewContainer(id);
  else if (n.kind === "function") viewFunction(id, r.qs);
  else viewComponents();
  crumbs(id);
  const lbl = id ? `${n.kind} ${label(n)}` : "Components";
  document.title = id ? `${clip(label(n), 40)} · Codemap` : "Codemap Explorer";
  $("#live").textContent = "Showing " + lbl;
}
function setHeader() {
  const gf = G.generated_from || {};
  $("#meta").textContent = `${gf.root_name || "graph"} · ${gf.commit ? gf.commit.slice(0, 7) : "commit unknown"} · ${fmt(I.byId.size)} nodes${SOURCE ? " · " + SOURCE : ""}`;
  $("#q").disabled = false;
}
const q = $("#q"), res = $("#results");
let hits = [], sel = -1;
function doSearch() {
  const s = q.value.trim().toLowerCase();
  if (!s || !I) { closeResults(); return; }
  const out = [];
  for (const x of I.search) {
    let score = -1;
    if (x.name === s) score = 0; else if (x.name.startsWith(s)) score = 1; else if (x.name.includes(s)) score = 2;
    else if (x.q.includes(s)) score = 3; else if (x.p.includes(s)) score = 4;
    if (score >= 0) out.push([score, KIND_ORDER[x.n.kind] ?? 9, x]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1] - b[1] || cmp(a[2].id, b[2].id));
  hits = out.slice(0, 30).map(o => o[2]); sel = hits.length ? 0 : -1;
  res.innerHTML = hits.length ? hits.map((h, i) => `<li role="option" id="r${i}" aria-selected="${i === sel}" data-i="${i}"><span class="k">${esc(h.n.kind === "type" ? h.n.type_kind || "type" : h.n.kind)}</span><span class="nm">${esc(label(h.n))}</span><span class="pt">${esc((h.n.path || h.n.id) + (h.n.line ? ":" + h.n.line : ""))}</span></li>`).join("")
                              : `<li class="none" role="option" aria-disabled="true">No node matches “${esc(q.value.trim())}”</li>`;
  if (out.length > 30) res.insertAdjacentHTML("beforeend", `<li class="none" role="presentation">${out.length - 30} more; refine the search</li>`);
  res.hidden = false; q.setAttribute("aria-expanded", "true");
  q.setAttribute("aria-activedescendant", sel >= 0 ? "r0" : "");
}
function moveSel(d) {
  if (!hits.length) return;
  sel = (sel + d + hits.length) % hits.length;
  res.querySelectorAll("li[role=option]").forEach((li, i) => li.setAttribute("aria-selected", String(i === sel)));
  q.setAttribute("aria-activedescendant", "r" + sel);
  $("#r" + sel)?.scrollIntoView({block: "nearest"});
}
function closeResults() { res.hidden = true; q.setAttribute("aria-expanded", "false"); q.removeAttribute("aria-activedescendant"); }
function go(i) { const h = hits[i]; if (!h) return; closeResults(); q.value = ""; location.hash = nodeHref(h.id); q.blur(); }
q.addEventListener("input", doSearch);
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); if (res.hidden) doSearch(); else moveSel(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
  else if (e.key === "Enter") { e.preventDefault(); go(sel); }
  else if (e.key === "Escape") { if (!res.hidden) closeResults(); else { q.value = ""; q.blur(); } }
});
q.addEventListener("blur", () => setTimeout(closeResults, 150));
res.addEventListener("mousedown", e => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); go(+li.dataset.i); } });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !q.disabled && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName)) { e.preventDefault(); q.focus(); }
});

/* ---------- loading ---------- */
function load(g, source) {
  if (!g || typeof g !== "object" || !Array.isArray(g.nodes)) throw new Error("not a codemap graph (no nodes array)");
  G = g; SOURCE = source; buildIndex(g); setHeader();
  if (g.schema !== "codemap/1") $("#meta").textContent += ` · schema ${g.schema || "missing"}, expected codemap/1`;
  render();
}
function emptyState(reason) {
  crumbs(null);
  work.innerHTML = `<div class="empty"><div class="box">
    <h2>No graph loaded</h2>
    <p>This viewer draws <code>graph.json</code>, the facts that <code>tools/codemap.py</code> extracts from the source tree. ${reason ? `<span class="err">${esc(reason)}</span>` : ""}</p>
    <p>Generate it from the repository root:</p>
    <pre>python3 tools/codemap.py</pre>
    <p>Then serve the explainers folder and open <a href="http://127.0.0.1:8765/codemap/">http://127.0.0.1:8765/codemap/</a>:</p>
    <pre>python3 -m http.server 8765 --bind 127.0.0.1 --directory explainers</pre>
    <div class="drop"><b>Or open a graph file directly</b><span class="muted">Drop a <code>graph.json</code> anywhere on this page, or pick one. Needed when the page is opened as a file, where the browser blocks loading it.</span>
      <label class="btn" for="file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M12 4v12M7 11l5 5 5-5"/></svg>Choose graph.json</label></div>
  </div></div>`;
}
function readFile(f) {
  f.text().then(t => { try { load(JSON.parse(t), f.name + " (local file)"); } catch (err) { emptyState(`Could not read ${f.name}: ${err.message}.`); } });
}
$("#file").addEventListener("change", e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ""; });
let dragDepth = 0;
document.addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging"); const f = e.dataTransfer?.files?.[0]; if (f) readFile(f); });
window.addEventListener("hashchange", render);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => dia && fit(true), 150); });
(function start() {
  const p = new URLSearchParams(location.search).get("graph");
  const url = p && /^[\w.-]+\.json$/.test(p) ? "./" + p : "./graph.json";
  if (location.protocol === "file:") { emptyState("Opened as a file, so the browser cannot fetch graph.json next to it."); return; }
  fetch(url, {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(`${url.slice(2)} not found (HTTP ${r.status}).`); return r.json(); })
    .then(g => load(g, url === "./graph.json" ? "" : url.slice(2)))
    .catch(err => emptyState(err.message.includes("JSON") ? `${url.slice(2)} is not valid JSON.` : err.message));
})();
</script>
</body>
</html>
